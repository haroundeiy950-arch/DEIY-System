[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deiy"
version = "1.0.0"
description = "DEIY education platform backend - onboarding, digital library, proctored exams, AI study rooms and utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.5,<3.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
s3 = ["boto3>=1.34"]

[tool.setuptools.packages.find]
include = ["deiy*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
